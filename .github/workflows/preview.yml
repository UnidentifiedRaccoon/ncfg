name: PR Preview (Web)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-preview-web-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  YC_REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}
  WEB_IMAGE: ncfg-web
  PREVIEW_DEPLOY_ENV: preview

jobs:
  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    environment: preview
    if: |
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install yc CLI
        run: |
          # Official installation script from Yandex Cloud docs.
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /tmp/yc -n
          echo "/tmp/yc/bin" >> "$GITHUB_PATH"

      - name: Configure yc CLI
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > /tmp/sa.json
          yc config set service-account-key /tmp/sa.json
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Lockbox preflight (preview web)
        id: preview-lockbox
        env:
          YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_LOCKBOX_SECRET_ID }}
          YC_LOCKBOX_VERSION_ID: ${{ secrets.YC_LOCKBOX_VERSION_ID }}
        run: |
          set -euo pipefail

          fetch_required_key() {
            local key="$1"
            local value=""
            value="$(yc lockbox payload get --id "$YC_LOCKBOX_SECRET_ID" --version-id "$YC_LOCKBOX_VERSION_ID" --key "$key" 2>/dev/null || true)"

            if [ -z "$value" ]; then
              echo "::error::Missing required Lockbox key: $key"
              exit 1
            fi

            printf '%s' "$value"
          }

          strapi_api_token="$(fetch_required_key STRAPI_API_TOKEN)"
          strapi_write_api_token="$(fetch_required_key STRAPI_WRITE_API_TOKEN)"

          echo "::add-mask::$strapi_api_token"
          echo "::add-mask::$strapi_write_api_token"

          printf 'strapi_api_token=%s\n' "$strapi_api_token" >> "$GITHUB_OUTPUT"

      - name: Ensure preview container exists and is public
        id: preview
        env:
          CONTAINER_NAME: ncfg-web-pr-${{ github.event.pull_request.number }}
        run: |
          # Create container if missing.
          if ! yc serverless container get --name "$CONTAINER_NAME" >/dev/null 2>&1; then
            yc serverless container create --name "$CONTAINER_NAME"
          fi

          # Make container publicly invokable (required for sharing preview URL).
          yc serverless container allow-unauthenticated-invoke --name "$CONTAINER_NAME" || true

          url="$(yc serverless container get --name "$CONTAINER_NAME" --format json | jq -r '.url')"
          if [ -z "$url" ] || [ "$url" = "null" ]; then
            echo "Failed to resolve preview url for container: $CONTAINER_NAME"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/${{ env.WEB_IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
            ${{ env.YC_REGISTRY }}/${{ env.WEB_IMAGE }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            STRAPI_URL=${{ secrets.STRAPI_URL }}
            STRAPI_API_TOKEN=${{ steps.preview-lockbox.outputs.strapi_api_token }}
            NEXT_PUBLIC_SITE_URL=${{ steps.preview.outputs.url }}
            PORTFOLIO_PRESENTATION_URL=${{ secrets.PORTFOLIO_PRESENTATION_URL }}
            DEPLOY_ENV=${{ env.PREVIEW_DEPLOY_ENV }}
          cache-from: type=gha,scope=web-preview
          cache-to: type=gha,mode=max,scope=web-preview

      - name: Deploy to Yandex Serverless Container (scale-to-zero)
        uses: yc-actions/yc-sls-container-deploy@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: ncfg-web-pr-${{ github.event.pull_request.number }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-image-url: ${{ env.YC_REGISTRY }}/${{ env.WEB_IMAGE }}:pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          revision-service-account-id: ${{ secrets.YC_CONTAINER_SA_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 30s
          revision-provisioned: 0
          revision-secrets: |
            STRAPI_API_TOKEN=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/STRAPI_API_TOKEN
            STRAPI_WRITE_API_TOKEN=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/STRAPI_WRITE_API_TOKEN
          revision-env: |
            NODE_ENV=production
            STRAPI_URL=${{ secrets.STRAPI_URL }}
            NEXT_PUBLIC_SITE_URL=${{ steps.preview.outputs.url }}
            PORTFOLIO_PRESENTATION_URL=${{ secrets.PORTFOLIO_PRESENTATION_URL }}
            DEPLOY_ENV=${{ env.PREVIEW_DEPLOY_ENV }}

      - name: Health check (tolerate cold start)
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          preview_base="${PREVIEW_URL%/}"
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$preview_base/api/health" || echo "000")"
            if [ "$code" = "200" ]; then
              echo "Health check passed"
              break
            fi
            echo "Attempt $i/20: /api/health returned $code, waiting 5s..."
            sleep 5
            if [ "$i" -eq 20 ]; then
              echo "Health check failed"
              exit 1
            fi
          done

      - name: Verify noindex header
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          # First request may be slow due to cold start.
          for i in $(seq 1 10); do
            if curl -sSIL --max-time 30 "$PREVIEW_URL" | tr -d '\r' | grep -qi '^x-robots-tag:.*noindex'; then
              echo "X-Robots-Tag header is present"
              exit 0
            fi
            echo "Attempt $i/10: missing X-Robots-Tag, waiting 3s..."
            sleep 3
          done
          echo "X-Robots-Tag header was not found"
          exit 1

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          CONTAINER_NAME: ncfg-web-pr-${{ github.event.pull_request.number }}
          IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
        with:
          github-token: ${{ secrets.PREVIEW_COMMENT_TOKEN || github.token }}
          script: |
            const marker = '<!-- ncfg-preview -->';
            const issue_number = context.payload.pull_request.number;
            const body = [
              marker,
              '',
              '### Frontend Preview',
              `- URL: ${process.env.PREVIEW_URL}`,
              `- Container: \`${process.env.CONTAINER_NAME}\``,
              `- Image tag: \`${process.env.IMAGE_TAG}\``,
              '- Cold start: enabled (scale-to-zero)',
              '',
              '_First open after inactivity can take 5-20 seconds (cold start)._',
            ].join('\n');

            const { owner, repo } = context.repo;
            try {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.find((c) => typeof c.body === 'string' && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (error) {
              if (error?.status === 403) {
                core.warning('Skipping preview comment: GITHUB_TOKEN has no permission to write issue comments.');
              } else {
                throw error;
              }
            }

  cleanup-preview:
    name: Cleanup preview
    runs-on: ubuntu-latest
    environment: preview
    if: |
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Install yc CLI
        run: |
          # Official installation script from Yandex Cloud docs.
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /tmp/yc -n
          echo "/tmp/yc/bin" >> "$GITHUB_PATH"

      - name: Configure yc CLI
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > /tmp/sa.json
          yc config set service-account-key /tmp/sa.json
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Delete preview container
        env:
          CONTAINER_NAME: ncfg-web-pr-${{ github.event.pull_request.number }}
        run: |
          yc serverless container delete --name "$CONTAINER_NAME" || true

      - name: Delete preview images for closed PR
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          repository="${YC_REGISTRY_ID}/ncfg-web"
          tag_regex="^pr-${PR_NUMBER}(-[0-9a-f]{40})?$"

          image_ids="$(
            yc container image list \
              --registry-id "$YC_REGISTRY_ID" \
              --repository-name "$repository" \
              --format json \
            | jq -r --arg tag_regex "$tag_regex" '
                .[]
                | select(any((.tags // [])[]?; test($tag_regex)))
                | .id
              '
          )"

          if [ -z "$image_ids" ]; then
            echo "No preview images found for PR #$PR_NUMBER"
            exit 0
          fi

          while IFS= read -r image_id; do
            [ -z "$image_id" ] && continue
            echo "Deleting preview image: $image_id"
            yc container image delete "$image_id"
          done <<< "$image_ids"

      - name: Update preview comment (optional)
        uses: actions/github-script@v7
        env:
          CONTAINER_NAME: ncfg-web-pr-${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.PREVIEW_COMMENT_TOKEN || github.token }}
          script: |
            const marker = '<!-- ncfg-preview -->';
            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            try {
              const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
              const existing = comments.find((c) => typeof c.body === 'string' && c.body.includes(marker));
              if (!existing) return;

              const body = [
                marker,
                '',
                '### Frontend Preview',
                `- Container: \`${process.env.CONTAINER_NAME}\``,
                '- Status: cleaned up (PR closed)',
              ].join('\n');

              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } catch (error) {
              if (error?.status === 403) {
                core.warning('Skipping cleanup comment update: GITHUB_TOKEN has no permission.');
              } else {
                throw error;
              }
            }

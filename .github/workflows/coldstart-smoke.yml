name: Coldstart Smoke

on:
  schedule:
    # Daily check for production first-hit latency after idle period.
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      idle_seconds:
        description: "Idle duration before first-hit probe (seconds)"
        type: number
        default: 300
      web_first_hit_threshold:
        description: "Max allowed web first-hit latency after idle (seconds)"
        type: number
        default: 2.5
      cms_first_hit_threshold:
        description: "Max allowed cms first-hit latency after idle (seconds)"
        type: number
        default: 4.0

permissions:
  contents: read

jobs:
  smoke:
    name: Measure coldstart regression
    runs-on: ubuntu-latest
    environment: production
    env:
      IDLE_SECONDS_INPUT: ${{ github.event.inputs.idle_seconds || '' }}
      WEB_THRESHOLD_INPUT: ${{ github.event.inputs.web_first_hit_threshold || '' }}
      CMS_THRESHOLD_INPUT: ${{ github.event.inputs.cms_first_hit_threshold || '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve smoke thresholds
        run: |
          set -euo pipefail

          idle_seconds="$IDLE_SECONDS_INPUT"
          web_threshold="$WEB_THRESHOLD_INPUT"
          cms_threshold="$CMS_THRESHOLD_INPUT"

          if [ -z "$idle_seconds" ]; then
            idle_seconds="300"
          fi
          if [ -z "$web_threshold" ]; then
            web_threshold="2.5"
          fi
          if [ -z "$cms_threshold" ]; then
            cms_threshold="4.0"
          fi

          if ! [[ "$idle_seconds" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid idle_seconds: $idle_seconds"
            exit 1
          fi

          number_pattern='^[0-9]+([.][0-9]+)?$'
          if ! [[ "$web_threshold" =~ $number_pattern ]]; then
            echo "::error::Invalid web_first_hit_threshold: $web_threshold"
            exit 1
          fi
          if ! [[ "$cms_threshold" =~ $number_pattern ]]; then
            echo "::error::Invalid cms_first_hit_threshold: $cms_threshold"
            exit 1
          fi

          echo "IDLE_SECONDS=$idle_seconds" >> "$GITHUB_ENV"
          echo "WEB_FIRST_HIT_THRESHOLD=$web_threshold" >> "$GITHUB_ENV"
          echo "CMS_FIRST_HIT_THRESHOLD=$cms_threshold" >> "$GITHUB_ENV"

      - name: Run first-hit latency probe
        run: |
          set -euo pipefail

          web_target="${{ secrets.NEXT_PUBLIC_SITE_URL }}"
          cms_target="${{ secrets.STRAPI_URL }}"
          web_health="${web_target%/}/api/health"
          cms_health="${cms_target%/}/_health"

          mkdir -p reports
          report_file="reports/coldstart-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.csv"

          ./scripts/measure-serverless-coldstart.sh \
            --target "web=$web_health" \
            --target "cms=$cms_health" \
            --warm-count 2 \
            --warm-interval 1 \
            --idle-seq "$IDLE_SECONDS" \
            --out "$report_file"

          echo "REPORT_FILE=$report_file" >> "$GITHUB_ENV"

      - name: Enforce thresholds
        run: |
          set -euo pipefail

          extract_csv_value() {
            local target="$1"
            local phase="$2"
            local column="$3"
            awk -F',' -v t="$target" -v p="$phase" -v c="$column" '
              $2 == t && $3 == p { print $c; exit }
            ' "$REPORT_FILE"
          }

          assert_float() {
            local value="$1"
            local label="$2"
            if ! [[ "$value" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "::error::$label is not a valid float: $value"
              exit 1
            fi
          }

          assert_lte() {
            local value="$1"
            local limit="$2"
            local label="$3"
            if ! awk -v v="$value" -v l="$limit" 'BEGIN { exit((v + 0 <= l + 0) ? 0 : 1) }'; then
              echo "::error::$label exceeded threshold: $value > $limit"
              exit 1
            fi
          }

          web_code="$(extract_csv_value "web" "after_idle_first" 6)"
          web_first_hit="$(extract_csv_value "web" "after_idle_first" 12)"
          cms_code="$(extract_csv_value "cms" "after_idle_first" 6)"
          cms_first_hit="$(extract_csv_value "cms" "after_idle_first" 12)"

          if [ -z "$web_code" ] || [ -z "$web_first_hit" ] || [ -z "$cms_code" ] || [ -z "$cms_first_hit" ]; then
            echo "::error::Failed to parse coldstart report: $REPORT_FILE"
            exit 1
          fi

          if [ "$web_code" != "200" ]; then
            echo "::error::Web health code mismatch after idle: expected 200, got $web_code"
            exit 1
          fi
          if [ "$cms_code" != "204" ]; then
            echo "::error::CMS health code mismatch after idle: expected 204, got $cms_code"
            exit 1
          fi

          assert_float "$web_first_hit" "web_first_hit"
          assert_float "$cms_first_hit" "cms_first_hit"
          assert_lte "$web_first_hit" "$WEB_FIRST_HIT_THRESHOLD" "web_first_hit"
          assert_lte "$cms_first_hit" "$CMS_FIRST_HIT_THRESHOLD" "cms_first_hit"

          echo "web first-hit: $web_first_hit s (threshold: $WEB_FIRST_HIT_THRESHOLD s)"
          echo "cms first-hit: $cms_first_hit s (threshold: $CMS_FIRST_HIT_THRESHOLD s)"

      - name: Upload coldstart report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coldstart-smoke-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_FILE }}
          if-no-files-found: warn

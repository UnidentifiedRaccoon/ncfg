name: Seed HR Diagnostic Test

on:
  workflow_dispatch:
    inputs:
      strapi_url:
        description: 'Production Strapi URL'
        required: true
        default: 'https://admin.ncfg.ru'
      token_key:
        description: 'Lockbox key with a Strapi API token allowed to upsert hr-diagnostic-test'
        required: true
        type: choice
        default: STRAPI_WRITE_API_TOKEN
        options:
          - STRAPI_WRITE_API_TOKEN
          - STRAPI_API_TOKEN

permissions:
  contents: read

jobs:
  seed:
    name: Seed HR diagnostic test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /tmp/yc -n
          echo "/tmp/yc/bin" >> "$GITHUB_PATH"

      - name: Configure yc CLI
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > /tmp/sa.json
          yc config set service-account-key /tmp/sa.json
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Run HR diagnostic seed
        env:
          STRAPI_URL: ${{ inputs.strapi_url }}
          TOKEN_KEY: ${{ inputs.token_key }}
          YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_LOCKBOX_SECRET_ID }}
          YC_LOCKBOX_VERSION_ID: ${{ secrets.YC_LOCKBOX_VERSION_ID }}
        run: |
          set -euo pipefail

          case "$TOKEN_KEY" in
            STRAPI_WRITE_API_TOKEN|STRAPI_API_TOKEN) ;;
            *)
              echo "::error::Unsupported token key: $TOKEN_KEY"
              exit 1
              ;;
          esac

          strapi_token="$(yc lockbox payload get --id "$YC_LOCKBOX_SECRET_ID" --version-id "$YC_LOCKBOX_VERSION_ID" --key "$TOKEN_KEY")"
          if [ -z "$strapi_token" ]; then
            echo "::error::Lockbox key is empty: $TOKEN_KEY"
            exit 1
          fi

          strapi_read_token="$(yc lockbox payload get --id "$YC_LOCKBOX_SECRET_ID" --version-id "$YC_LOCKBOX_VERSION_ID" --key STRAPI_API_TOKEN)"
          if [ -z "$strapi_read_token" ]; then
            echo "::error::Lockbox key is empty: STRAPI_API_TOKEN"
            exit 1
          fi

          echo "::add-mask::$strapi_token"
          echo "::add-mask::$strapi_read_token"
          STRAPI_TOKEN="$strapi_token" STRAPI_READ_TOKEN="$strapi_read_token" node apps/cms/scripts/seed-hr-diagnostic-test-prod.mjs

          active_response="$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $strapi_read_token" \
            "$STRAPI_URL/api/hr-diagnostic-tests/active/hr")"
          active_status="$(printf '%s' "$active_response" | tail -n 1)"
          active_body="$(printf '%s' "$active_response" | sed '$d')"

          if [ "$active_status" != "200" ]; then
            echo "::error::Active HR diagnostic endpoint returned HTTP $active_status: $active_body"
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(0, "utf8"));
            const data = payload && payload.data;
            if (!data || data.slug !== "hr" || data.version !== 1 || !Array.isArray(data.groups) || data.groups.length === 0) {
              console.error("Invalid active HR diagnostic response");
              process.exit(1);
            }
            console.log(`[seed-hr] active endpoint verified: ${data.documentId || "without-documentId"}`);
          ' <<< "$active_body"

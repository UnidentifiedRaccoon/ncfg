# Yandex Cloud Deployment Pipeline
# Deploys Next.js and Strapi to Serverless Containers

name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_web:
        description: 'Deploy web (Next.js)'
        type: boolean
        default: true
      deploy_cms:
        description: 'Deploy CMS (Strapi)'
        type: boolean
        default: true

env:
  YC_REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}
  WEB_IMAGE: ncfg-web
  CMS_IMAGE: ncfg-cms

jobs:
  # Detect which services changed
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'docker/web/**'
              - 'pnpm-lock.yaml'
            cms:
              - 'apps/cms/**'
              - 'docker/cms/**'

  # Build and push Next.js image
  build-web:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.web == 'true' ||
      github.event.inputs.deploy_web == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.YC_REGISTRY }}/${{ env.WEB_IMAGE }}:latest
          build-args: |
            STRAPI_URL=${{ secrets.STRAPI_URL }}
            STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Build and push Strapi image
  build-cms:
    name: Build Strapi
    runs-on: ubuntu-latest
    needs: changes
    if: |
      needs.changes.outputs.cms == 'true' ||
      github.event.inputs.deploy_cms == 'true' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install yc CLI
        run: |
          # Official installation script from Yandex Cloud docs.
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /tmp/yc -n
          echo "/tmp/yc/bin" >> "$GITHUB_PATH"

      - name: Configure yc CLI
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > /tmp/sa.json
          yc config set service-account-key /tmp/sa.json
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Lockbox preflight
        env:
          YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_LOCKBOX_SECRET_ID }}
          YC_LOCKBOX_VERSION_ID: ${{ secrets.YC_LOCKBOX_VERSION_ID }}
        run: |
          set -euo pipefail

          required_lockbox_keys=(
            DATABASE_HOST
            DATABASE_PORT
            DATABASE_NAME
            DATABASE_USERNAME
            DATABASE_PASSWORD
            APP_KEYS
            API_TOKEN_SALT
            ADMIN_JWT_SECRET
            JWT_SECRET
            TRANSFER_TOKEN_SALT
            AWS_BUCKET
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
          )

          fetch_required_key() {
            local key="$1"
            local value=""
            value="$(yc lockbox payload get --id "$YC_LOCKBOX_SECRET_ID" --version-id "$YC_LOCKBOX_VERSION_ID" --key "$key" 2>/dev/null || true)"

            if [ -z "$value" ]; then
              echo "::error::Missing required Lockbox key: $key"
              exit 1
            fi

            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          }

          for key in "${required_lockbox_keys[@]}"; do
            fetch_required_key "$key"
          done

          aws_region="ru-central1"
          aws_endpoint="https://storage.yandexcloud.net"

          if [ -z "$aws_region" ] || [ -z "$aws_endpoint" ]; then
            echo "::error::AWS_REGION or AWS_ENDPOINT is empty"
            exit 1
          fi

          printf 'AWS_REGION=%s\n' "$aws_region" >> "$GITHUB_ENV"
          printf 'AWS_ENDPOINT=%s\n' "$aws_endpoint" >> "$GITHUB_ENV"

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cms/Dockerfile
          push: true
          tags: |
            ${{ env.YC_REGISTRY }}/${{ env.CMS_IMAGE }}:${{ github.sha }}
            ${{ env.YC_REGISTRY }}/${{ env.CMS_IMAGE }}:latest
          build-args: |
            CACHE_BUST=${{ github.sha }}
          secret-envs: |
            DATABASE_HOST=DATABASE_HOST
            DATABASE_PORT=DATABASE_PORT
            DATABASE_NAME=DATABASE_NAME
            DATABASE_USERNAME=DATABASE_USERNAME
            DATABASE_PASSWORD=DATABASE_PASSWORD
            APP_KEYS=APP_KEYS
            API_TOKEN_SALT=API_TOKEN_SALT
            ADMIN_JWT_SECRET=ADMIN_JWT_SECRET
            JWT_SECRET=JWT_SECRET
            TRANSFER_TOKEN_SALT=TRANSFER_TOKEN_SALT
            AWS_BUCKET=AWS_BUCKET
            AWS_ACCESS_KEY_ID=AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=AWS_SECRET_ACCESS_KEY
            AWS_REGION=AWS_REGION
            AWS_ENDPOINT=AWS_ENDPOINT
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy Next.js to Serverless Container
  deploy-web:
    name: Deploy Next.js
    runs-on: ubuntu-latest
    needs: build-web
    environment: production
    steps:
      - name: Deploy to Yandex Serverless Container
        uses: yc-actions/yc-sls-container-deploy@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: ncfg-web
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-image-url: ${{ env.YC_REGISTRY }}/${{ env.WEB_IMAGE }}:${{ github.sha }}
          revision-service-account-id: ${{ secrets.YC_CONTAINER_SA_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 30s
          revision-provisioned: 0
          revision-env: |
            NODE_ENV=production
            STRAPI_URL=${{ secrets.STRAPI_URL }}
            STRAPI_API_TOKEN=${{ secrets.STRAPI_API_TOKEN }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_YANDEX_METRIKA_ID=${{ secrets.NEXT_PUBLIC_YANDEX_METRIKA_ID }}
            GETCOURSE_BASE_URL=https://fgrm.ncfg.ru
            GETCOURSE_API_KEY=${{ secrets.GETCOURSE_API_KEY }}
            GETCOURSE_LEAD_GROUP_NAME=Website Leads
            GETCOURSE_QUESTION_GROUP_NAME=Website Questions
            GETCOURSE_SOURCE_VALUE=fgrm.ncfg.ru

  # Deploy Strapi to Serverless Container
  deploy-cms:
    name: Deploy Strapi
    runs-on: ubuntu-latest
    needs: build-cms
    environment: production
    steps:
      - name: Deploy to Yandex Serverless Container
        uses: yc-actions/yc-sls-container-deploy@v2
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: ncfg-cms
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          revision-image-url: ${{ env.YC_REGISTRY }}/${{ env.CMS_IMAGE }}:${{ github.sha }}
          revision-service-account-id: ${{ secrets.YC_CONTAINER_SA_ID }}
          revision-cores: 1
          revision-memory: 2Gb
          revision-core-fraction: 100
          revision-concurrency: 4
          revision-execution-timeout: 120s
          revision-provisioned: 0
          revision-secrets: |
            DATABASE_HOST=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/DATABASE_HOST
            DATABASE_PORT=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/DATABASE_PORT
            DATABASE_NAME=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/DATABASE_NAME
            DATABASE_USERNAME=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/DATABASE_USERNAME
            DATABASE_PASSWORD=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/DATABASE_PASSWORD
            AWS_ACCESS_KEY_ID=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/AWS_SECRET_ACCESS_KEY
            AWS_BUCKET=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/AWS_BUCKET
            APP_KEYS=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/APP_KEYS
            API_TOKEN_SALT=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/API_TOKEN_SALT
            ADMIN_JWT_SECRET=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/ADMIN_JWT_SECRET
            JWT_SECRET=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/JWT_SECRET
            TRANSFER_TOKEN_SALT=${{ secrets.YC_LOCKBOX_SECRET_ID }}/${{ secrets.YC_LOCKBOX_VERSION_ID }}/TRANSFER_TOKEN_SALT
          revision-env: |
            NODE_ENV=production
            DATABASE_CLIENT=postgres
            DATABASE_SSL=true
            DATABASE_SSL_REJECT_UNAUTHORIZED=false
            AWS_REGION=ru-central1
            AWS_ENDPOINT=https://storage.yandexcloud.net
            HOST=0.0.0.0
            PUBLIC_URL=https://admin.ncfg.ru
            ADMIN_URL=/admin

  # Health check after deployment
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-web, deploy-cms]
    if: always() && (needs.deploy-web.result == 'success' || needs.deploy-cms.result == 'success')
    steps:
      - name: Wait for containers to start
        run: sleep 30

      - name: Check web health
        if: needs.deploy-web.result == 'success'
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.NEXT_PUBLIC_SITE_URL }}/api/health" || echo "000")
          if [ "$response" != "200" ]; then
            echo "Web health check failed with status: $response"
            exit 1
          fi
          echo "Web health check passed"

      - name: Check CMS health
        if: needs.deploy-cms.result == 'success'
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STRAPI_URL }}/_health" || echo "000")
          if [ "$response" != "204" ]; then
            echo "CMS health check failed with status: $response"
            exit 1
          fi
          echo "CMS health check passed"

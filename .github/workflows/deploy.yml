name: Deploy to Cloud.ru

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'infra/cloudru/autodeploy/**'
      - 'docker/**'
      - 'scripts/retain-next-static*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudru-deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.2'
      - name: Verify deployment failure handling and static asset retention
        run: |
          python3 -m unittest discover -s infra/cloudru/autodeploy -p 'test_*.py'
          node --test scripts/retain-next-static.test.mjs
          node --check apps/cms/config/plugins.js
          node --check apps/cms/config/middlewares.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Approve the current main revision for the Cloud.ru pull service
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$REVISION" ]; then
            echo 'This revision has been superseded; no deployment requested.'
            echo 'requested=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$REPOSITORY/git/ref/heads/cloudru-production" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPOSITORY/git/refs/heads/cloudru-production" \
              -f sha="$REVISION" -F force=false >/dev/null
          else
            gh api -X POST "repos/$REPOSITORY/git/refs" \
              -f ref=refs/heads/cloudru-production -f sha="$REVISION" >/dev/null
          fi
          echo 'requested=true' >> "$GITHUB_OUTPUT"
      - name: Wait for the public server to run this exact release
        if: steps.request.outputs.requested == 'true'
        env:
          REVISION: ${{ github.sha }}
        run: python3 infra/cloudru/autodeploy/wait_for_release.py
